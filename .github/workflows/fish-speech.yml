name: Compare fish-speech
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fish-speech.yml'
permissions:
  contents: read
jobs:
  voice-test:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install model dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fish-speech soundfile numpy
      - name: Generate both voices
        run: python run_comparison.py --model fish-speech
      - name: Upload finished recordings even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fish-speech-samples
          path: outputs/
          if-no-files-found: warn
          retention-days: 7
