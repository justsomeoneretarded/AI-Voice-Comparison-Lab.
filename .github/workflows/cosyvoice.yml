name: Compare cosyvoice
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cosyvoice.yml'
permissions:
  contents: read
jobs:
  voice-test:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg sox libsox-dev
      - name: Install model dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'setuptools==69.5.1' wheel 'numpy==1.26.4' cython packaging
          git clone --recursive --depth 1 https://github.com/QwenAudio/CosyVoice.git vendor/CosyVoice
          python -m pip install --no-build-isolation -r vendor/CosyVoice/requirements.txt
          python -m pip install huggingface_hub soundfile numpy
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(repo_id="FunAudioLLM/CosyVoice2-0.5B", local_dir="pretrained_models/CosyVoice2-0.5B")
          PY
      - name: Generate both voices
        run: PYTHONPATH=vendor/CosyVoice:vendor/CosyVoice/third_party/Matcha-TTS python run_comparison.py --model cosyvoice
      - name: Upload finished recordings even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cosyvoice-samples
          path: outputs/
          if-no-files-found: warn
          retention-days: 7
